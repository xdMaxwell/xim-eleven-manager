kind = "web"
previewPath = "/"
title = "Project Stadium Fever"
version = "1.0.0"
id = "artifacts/stadium-fever"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24965

[services.development]
run = "pnpm --filter @workspace/stadium-fever run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stadium-fever", "run", "build" ]
publicDir = "artifacts/stadium-fever/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24965"
BASE_PATH = "/"
